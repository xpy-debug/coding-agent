<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coding Chat</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        border: 'hsl(var(--border) / <alpha-value>)',
                        input: 'hsl(var(--input) / <alpha-value>)',
                        ring: 'hsl(var(--ring) / <alpha-value>)',
                        background: 'hsl(var(--background) / <alpha-value>)',
                        foreground: 'hsl(var(--foreground) / <alpha-value>)',
                        primary: {
                            DEFAULT: 'hsl(var(--primary) / <alpha-value>)',
                            foreground: 'hsl(var(--primary-foreground) / <alpha-value>)',
                        },
                        secondary: {
                            DEFAULT: 'hsl(var(--secondary) / <alpha-value>)',
                            foreground: 'hsl(var(--secondary-foreground) / <alpha-value>)',
                        },
                        destructive: {
                            DEFAULT: 'hsl(var(--destructive) / <alpha-value>)',
                            foreground: 'hsl(var(--destructive-foreground) / <alpha-value>)',
                        },
                        success: 'hsl(var(--success) / <alpha-value>)',
                        warning: 'hsl(var(--warning) / <alpha-value>)',
                        muted: {
                            DEFAULT: 'hsl(var(--muted) / <alpha-value>)',
                            foreground: 'hsl(var(--muted-foreground) / <alpha-value>)',
                        },
                        accent: {
                            DEFAULT: 'hsl(var(--accent) / <alpha-value>)',
                            foreground: 'hsl(var(--accent-foreground) / <alpha-value>)',
                        },
                        card: {
                            DEFAULT: 'hsl(var(--card) / <alpha-value>)',
                            foreground: 'hsl(var(--card-foreground) / <alpha-value>)',
                        },
                    },
                    borderRadius: {
                        sm: 'var(--radius-sm)',
                        DEFAULT: 'var(--radius)',
                        md: 'var(--radius)',
                        lg: 'var(--radius-lg)',
                        xl: 'var(--radius-xl)',
                        '2xl': 'var(--radius-xl)',
                        '3xl': 'calc(var(--radius-xl) + 0.5rem)',
                    },
                    fontFamily: {
                        sans: ['ui-sans-serif', 'system-ui', '-apple-system', 'Segoe UI', 'Roboto', 'Helvetica Neue', 'Arial', 'sans-serif'],
                        mono: ['ui-monospace', 'SFMono-Regular', 'JetBrains Mono', 'Menlo', 'Consolas', 'monospace'],
                    },
                    boxShadow: {
                        soft: '0 1px 2px hsl(240 20% 4% / 0.04), 0 12px 32px -20px hsl(240 20% 4% / 0.24)',
                    },
                },
            },
        };
    </script>

    <!-- Marked.js for Markdown rendering -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <!-- highlight.js for code highlighting (theme swaps with light/dark) -->
    <link id="hljs-theme" rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/github-dark.min.css">
    <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>

    <link rel="stylesheet" href="/css/app.css">
</head>
<body class="bg-background text-foreground h-screen overflow-hidden">
    <div id="app" class="h-full flex flex-col">
        <!-- Header -->
        <header class="app-header flex-shrink-0 border-b border-border px-3 sm:px-4 h-14 flex items-center justify-between gap-2">
            <div class="flex items-center gap-1.5 min-w-0">
                <button id="btn-sidebar" class="icon-btn" title="Toggle chats" aria-label="Toggle chats" aria-expanded="false" aria-controls="session-sidebar">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16"/>
                    </svg>
                </button>
                <h1 class="app-title text-sm font-semibold tracking-tight">Coding Chat</h1>
            </div>
            <div class="flex items-center gap-1.5 min-w-0">
                <button id="btn-model" class="chip-btn" title="Select model">
                    <span id="model-name" class="truncate">No model</span>
                </button>
                <button id="btn-thinking" class="chip-btn hidden" title="Thinking level">
                    <span id="thinking-level">off</span>
                </button>
                <button id="btn-approval" class="chip-btn" title="Tool approval: auto runs everything, ask requests consent for risky calls">
                    <span id="approval-mode">auto</span>
                </button>
                <button id="btn-new-session" class="btn-primary">
                    New Chat
                </button>
                <button id="btn-settings" class="icon-btn" title="Settings" aria-label="Settings">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
                </button>
                <button id="btn-theme" class="icon-btn" title="Toggle theme" aria-label="Toggle theme">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
                </button>
            </div>
        </header>

        <!-- Main chat area -->
        <main id="chat-area" class="flex-1 flex overflow-hidden">
            <!-- Messages panel -->
            <div id="messages-panel" class="flex-1 flex flex-col min-w-0">
                <!-- Message list -->
                <div id="message-list" class="flex-1 overflow-y-auto">
                    <div id="messages-container" class="max-w-3xl mx-auto p-4 flex flex-col gap-3">
                    </div>
                </div>

                <!-- Streaming indicator -->
                <div id="streaming-container" class="hidden max-w-3xl mx-auto w-full px-4">
                    <div id="streaming-message"></div>
                    <div class="flex items-center gap-1 py-1">
                        <span class="inline-block w-2 h-4 bg-muted-foreground animate-pulse rounded-sm"></span>
                    </div>
                </div>

                <!-- Input area -->
                <div class="flex-shrink-0 pb-3">
                    <div class="max-w-3xl mx-auto px-3">
                        <div id="message-editor"></div>
                        <div id="stats" class="text-xs text-muted-foreground flex justify-end items-center h-5 px-2"></div>
                    </div>
                </div>
            </div>

            <!-- Artifacts panel -->
            <div id="artifacts-panel" class="hidden"></div>
        </main>
    </div>

    <!-- Sliding session sidebar -->
    <div id="sidebar-backdrop" class="sidebar-backdrop"></div>
    <aside id="session-sidebar" class="session-sidebar" aria-label="Chat history">
        <div class="flex items-center justify-between gap-2 px-4 pt-4 pb-2 flex-shrink-0">
            <div class="flex items-baseline gap-2 min-w-0">
                <h2 class="text-sm font-semibold tracking-tight">Chats</h2>
                <span id="session-count" class="text-xs text-muted-foreground"></span>
            </div>
            <button id="sidebar-close" class="icon-btn" title="Hide chats" aria-label="Hide chats">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M15 6l-6 6 6 6"/>
                </svg>
            </button>
        </div>
        <div id="session-list" class="flex-1 overflow-y-auto px-2.5 pb-4 space-y-1.5"></div>
    </aside>

    <!-- Dialogs container -->
    <div id="dialogs"></div>

    <!-- Provider / API Key prompt dialog -->
    <dialog id="api-key-dialog" class="bg-card text-card-foreground border border-border rounded-xl shadow-xl p-6 max-w-md w-full">
        <h2 class="text-lg font-semibold mb-4">Provider Setup</h2>
        <label for="api-key-provider" class="block text-xs font-medium text-muted-foreground mb-1">Provider</label>
        <select id="api-key-provider" class="w-full px-3 py-2 rounded-md border border-input bg-background text-foreground text-sm mb-4"></select>
        <label for="api-key-input" class="block text-xs font-medium text-muted-foreground mb-1">API Key</label>
        <input id="api-key-input" type="password" class="w-full px-3 py-2 rounded-md border border-input bg-background text-foreground text-sm mb-1" placeholder="sk-...">
        <p id="api-key-hint" class="text-xs text-muted-foreground mb-4"></p>
        <div id="api-key-base-url-group" class="hidden">
            <label for="api-key-base-url" class="block text-xs font-medium text-muted-foreground mb-1">Base URL</label>
            <input id="api-key-base-url" type="text" class="w-full px-3 py-2 rounded-md border border-input bg-background text-foreground text-sm mb-1" placeholder="https://api.example.com/v1">
            <p class="text-xs text-muted-foreground mb-4">Models are fetched from this endpoint when you save. Leave the key blank for servers that need none.</p>
        </div>
        <p id="api-key-error" class="hidden text-xs text-destructive mb-4"></p>
        <div class="flex justify-end gap-2">
            <button id="api-key-cancel" class="px-4 py-1.5 text-sm rounded-full border border-border hover:bg-secondary transition-colors">Cancel</button>
            <button id="api-key-save" class="px-4 py-1.5 text-sm rounded-full bg-primary text-primary-foreground font-medium hover:opacity-90 transition-opacity">Save</button>
        </div>
    </dialog>

    <!-- App scripts -->
    <script type="module" src="/js/app.js"></script>
</body>
</html>
