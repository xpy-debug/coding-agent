[project]
name = "coding"
version = "0.1.0"
description = "AI coding agent with tools, sessions, and a web UI"
requires-python = ">=3.14"
license = "MIT"
dependencies = [
    "pydantic>=2.10",
    "httpx>=0.28",
    "openai>=1.60",
    "jsonschema>=4.23",
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "aiosqlite>=0.20",
    "websockets>=14.0",
    "python-multipart>=0.0.9",
]

[project.scripts]
coding = "coding.cli:main"
coding-web = "coding.web.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/coding"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
