[project]
name = "coding-monorepo"
version = "0.1.0"
description = "AI agent tooling monorepo"
requires-python = ">=3.14"
license = "MIT"

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/coding"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "jsonschema>=4.23",
]
